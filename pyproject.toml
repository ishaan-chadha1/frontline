[project]
name = "frontline"
version = "0.1.0"
description = "Frontline retail intelligence: voice capture to evidence-backed signals"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "certifi>=2024.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
gcp = ["google-cloud-storage>=2.18", "google-cloud-speech>=2.27", "google-genai>=0.3"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
